name: Fuxing - Ejecucion diaria

on:
  workflow_dispatch:
  schedule:
    - cron: '59 21 * * *'
    - cron: '59 22 * * *'

jobs:
  ejecutar-fuxing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy matplotlib joblib requests beautifulsoup4

      - name: Comprobar hora de Madrid
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          echo "Hora actual en Madrid: $HORA"
          if [ "$HORA" != "23" ]; then
            echo "No corresponde a la ejecución de las 23:59 de Madrid."
            exit 0
          fi

      - name: Ejecutar Fuxing
        run: |
          python -u Fuxin_Git_Programa_Base_Prueba1.py
